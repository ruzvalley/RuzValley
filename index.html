<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Ruz Valley Restaurant POS">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/pos-192.png">
  <link rel="apple-touch-icon" href="./icons/pos-192.png">
  <title>Ruz Valley POS</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#111b2e;--line:#1f2b42;--red:#e11d2e;--muted:#9aa7bd}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #app{position:fixed;inset:0;display:flex;flex-direction:column}
    #bar{height:44px;flex:0 0 44px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px}
    #brand{font-weight:800;color:#ff8791;letter-spacing:.2px}
    #actions{display:flex;align-items:center;gap:8px}
    button,a{font:inherit}
    .action{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:9px;padding:6px 10px;text-decoration:none;font-size:12px}
    #framewrap{position:relative;flex:1;min-height:0;background:var(--bg)}
    #posframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
    #message{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:var(--bg);color:#fff}
    #message.show{display:grid}
    #message .box{max-width:440px}
    #message p{color:var(--muted);line-height:1.5}
    @media (display-mode:standalone){#bar{height:36px;flex-basis:36px}}
  </style>
</head>
<body>
  <main id="app">
    <header id="bar">
      <div id="brand">RUZ VALLEY · POS</div>
      <div id="actions">
        <button class="action" id="notifyBtn">Enable alerts</button>
        <button class="action" id="install" hidden>Install app</button>
        <a class="action" id="openNew" href="#" target="_blank" rel="noopener">Open separately</a>
      </div>
    </header>
    <section id="framewrap">
      <iframe id="posframe" title="Ruz Valley POS" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div id="message">
        <div class="box">
          <strong>POS link not configured</strong>
          <p>Open <code>config.js</code> in this GitHub repository and paste the deployed Google Apps Script Web App URL ending in <code>/exec</code>. Commit the change and reload this app.</p>
        </div>
      </div>
    </section>
  </main>
  <script src="./config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
  <script>
    (() => {
      const url = String(window.RUZ_POS_CONFIG?.APP_URL || "").trim();
      const valid = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(url);
      const frame = document.getElementById("posframe");
      const msg = document.getElementById("message");
      const open = document.getElementById("openNew");
      if (valid) {
        frame.src = url;
        open.href = url;
        frame.addEventListener("error", () => msg.classList.add("show"));
      } else {
        msg.classList.add("show");
        open.hidden = true;
      }

      let installPrompt = null;
      const installButton = document.getElementById("install");
      window.addEventListener("beforeinstallprompt", event => {
        event.preventDefault();
        installPrompt = event;
        installButton.hidden = false;
      });
      installButton.addEventListener("click", async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        installButton.hidden = true;
      });
      window.addEventListener("appinstalled", () => installButton.hidden = true);

      // Firebase Web Push registration runs on GitHub Pages origin, using this existing service worker.
      const firebaseConfig = {
        apiKey: "AIzaSyDHPzV22QAopJCpwvwnsmiPEYSd6pRNamc",
        authDomain: "ruz-valley-pos.firebaseapp.com",
        projectId: "ruz-valley-pos",
        storageBucket: "ruz-valley-pos.firebasestorage.app",
        messagingSenderId: "1070715442602",
        appId: "1:1070715442602:web:08927d1e1f817047ee87d3"
      };
      const VAPID_KEY = "BJxgchIK3wqq51um-8x3cCOMQ0YL2rVTpVkNtQluiQVZV3FDTKrtNpOvfQqIyErdiyGZ8QQOMfnagO-sNdQa6jQ";
      let fcmToken = "";
      const notifyButton = document.getElementById("notifyBtn");
      async function registerTokenWithBackend(token) {
        const response = await fetch(url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify({
            type: "REGISTER_FCM_TOKEN",
            token: token,
            deviceName: (navigator.userAgent.match(/Android|iPhone|iPad|Windows|Macintosh/i) || ["POS device"])[0]
          })
        });
        // no-cors responses are opaque; Apps Script Executions and the sheet confirm receipt.
        return response;
      }
      async function enableAlerts() {
        try {
          if (!("serviceWorker" in navigator) || !("Notification" in window) || !window.firebase) {
            throw new Error("Notifications are not supported in this browser.");
          }
          notifyButton.disabled = true; notifyButton.textContent = "Enabling...";
          const permission = await Notification.requestPermission();
          if (permission !== "granted") throw new Error("Notification permission was not granted.");
          const registration = await navigator.serviceWorker.register("./sw.js");
          await navigator.serviceWorker.ready;
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          const messaging = firebase.messaging();
          fcmToken = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
          if (!fcmToken) throw new Error("Could not get a device token. Please try again.");
          await registerTokenWithBackend(fcmToken);
          notifyButton.textContent = "Registration sent";
          notifyButton.disabled = false;
          alert("Notification registration request sent. Please check the NotificationTokens sheet to confirm this device is registered.");
        } catch (e) {
          notifyButton.disabled = false; notifyButton.textContent = "Enable alerts";
          alert(e && e.message ? e.message : String(e));
        }
      }
      notifyButton.addEventListener("click", enableAlerts);
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
      }
    })();
  </script>
</body>
</html>
