<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Ruz Valley Restaurant POS">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/pos-192.png">
  <link rel="apple-touch-icon" href="./icons/pos-192.png">
  <title>Ruz Valley POS</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#111b2e;--line:#1f2b42;--red:#e11d2e;--muted:#9aa7bd}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #app{position:fixed;inset:0;display:flex;flex-direction:column}
    #bar{height:44px;flex:0 0 44px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px}
    #brand{font-weight:800;color:#ff8791;letter-spacing:.2px}
    #actions{display:flex;align-items:center;gap:8px}
    button,a{font:inherit}
    .action{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:9px;padding:6px 10px;text-decoration:none;font-size:12px}
    #framewrap{position:relative;flex:1;min-height:0;background:var(--bg)}
    #posframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
    #message{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:var(--bg);color:#fff}
    #message.show{display:grid}
    #message .box{max-width:440px}
    #message p{color:var(--muted);line-height:1.5}
    @media (display-mode:standalone){#bar{height:36px;flex-basis:36px}}
  </style>
</head>
<body>
  <main id="app">
    <header id="bar">
      <div id="brand">RUZ VALLEY · POS</div>
      <div id="actions">
        <button class="action" id="install" hidden>Install app</button>
        <a class="action" id="openNew" href="#" target="_blank" rel="noopener">Open separately</a>
      </div>
    </header>
    <section id="framewrap">
      <iframe id="posframe" title="Ruz Valley POS" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div id="message">
        <div class="box">
          <strong>POS link not configured</strong>
          <p>Open <code>config.js</code> in this GitHub repository and paste the deployed Google Apps Script Web App URL ending in <code>/exec</code>. Commit the change and reload this app.</p>
        </div>
      </div>
    </section>
  </main>
  <script src="./config.js"></script>
  <script>
    (() => {
      const url = String(window.RUZ_POS_CONFIG?.APP_URL || "").trim();
      const valid = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(url);
      const frame = document.getElementById("posframe");
      const msg = document.getElementById("message");
      const open = document.getElementById("openNew");
      if (valid) {
        frame.src = url;
        open.href = url;
        frame.addEventListener("error", () => msg.classList.add("show"));
      } else {
        msg.classList.add("show");
        open.hidden = true;
      }

      let installPrompt = null;
      const installButton = document.getElementById("install");
      window.addEventListener("beforeinstallprompt", event => {
        event.preventDefault();
        installPrompt = event;
        installButton.hidden = false;
      });
      installButton.addEventListener("click", async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        installButton.hidden = true;
      });
      window.addEventListener("appinstalled", () => installButton.hidden = true);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
      }
    })();
  </script>
</body>
</html>
